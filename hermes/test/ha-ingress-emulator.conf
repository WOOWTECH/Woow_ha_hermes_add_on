# Emulates HA Core + Supervisor ingress in front of the add-on's ingress port.
# Runs at 172.30.32.2, the Supervisor's address, which the add-on nginx allows.
events { worker_connections 512; }
http {
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8080;
        client_max_body_size 0;

        # HA Core routes /api/hassio_ingress/{token}/{path}: the bare prefix is a 404.
        location ~ ^/api/hassio_ingress/[A-Za-z0-9_-]+$ {
            return 404 "HA Core 404 (slash-less ingress prefix)\n";
        }

        location ~ ^/api/hassio_ingress/(?<tok>[A-Za-z0-9_-]{16,128})(?<rest>/.*)$ {
            proxy_pass http://172.30.33.10:9120$rest$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Ingress-Path /api/hassio_ingress/$tok;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Remote-User-Id test-user-id;
            proxy_set_header X-Remote-User-Name test;
            # The Supervisor drops these request headers.
            proxy_set_header Sec-WebSocket-Protocol "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # The HA panel is a same-origin iframe.
        location = /__ha_panel.html {
            default_type text/html;
            return 200 '<!doctype html><html><body style="margin:0"><iframe id="f" style="width:100vw;height:100vh;border:0"></iframe><script>document.getElementById("f").src=new URLSearchParams(location.search).get("src")</script></body></html>';
        }

        location / {
            return 404 "HA Core 404 (request escaped the ingress prefix)\n";
        }
    }
}
